// Retorna a chave do signo para uma data
function getSignForDate(month, day) {
  for (const [key, meta] of Object.entries(SIGNS_META)) {
    const [sm, sd] = meta.start;
    const [em, ed] = meta.end;
    // Capricórnio cruza a virada do ano
    if (sm > em) {
      if ((month === sm && day >= sd) || (month === em && day <= ed)) return key;
    } else {
      if ((month === sm && day >= sd) || (month > sm && month < em) || (month === em && day <= ed)) return key;
    }
  }
  return 'capricornio';
}

// Compatibilidade por elemento
const ELEMENT_COMPATIBLE = {
  'Fogo':  ['Fogo', 'Ar'],
  'Terra': ['Terra', 'Água'],
  'Ar':    ['Ar', 'Fogo'],
  'Água':  ['Água', 'Terra'],
};

function getCompatibleSign(signKey, days) {
  const myElement = SIGNS_META[signKey].element;
  const compatElements = ELEMENT_COMPATIBLE[myElement];
  const pool = Object.entries(SIGNS_META)
    .filter(([k, m]) => k !== signKey && compatElements.includes(m.element))
    .map(([k, m]) => ({ key: k, name: m.name }));
  return pool[(days * 83 + SIGNS_META[signKey].index) % pool.length];
}

// ── SISTEMA DE PICK ───────────────────────────────────────────────────────────
function daysSinceBase(date) {
  const ms = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate())
           - Date.UTC(2000, 0, 1);
  return Math.floor(ms / 86400000);
}

function pick(array, days, signIndex, mult) {
  if (!array || array.length === 0) return '';
  return array[(days * mult + signIndex) % array.length];
}

// ── GERADOR ───────────────────────────────────────────────────────────────────
let generatedJSON = null;

function generate() {
  const month = parseInt(document.getElementById('month').value);
  const year  = parseInt(document.getElementById('year').value);
  const daysInMonth = new Date(year, month, 0).getDate();

  const result = {
    month,
    year,
    signs: {}
  };

  for (const [signKey, meta] of Object.entries(SIGNS_META)) {
    const si = meta.index;
    result.signs[signKey] = [];

    for (let day = 1; day <= daysInMonth; day++) {
      const date    = new Date(year, month - 1, day);
      const days    = daysSinceBase(date);
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

      const sd = SIGN_DATA[signKey];

      const number = pick(GENERAL.numbers,  days, si, MULT.dailyNumber);
      const color  = pick(GENERAL.colors,   days, si, MULT.dailyColor);
      const stone  = pick(GENERAL.stones,   days, si, MULT.dailyStone);
      const compat = getCompatibleSign(signKey, days);

      const opening = pick(sd.openings, days, si, MULT.opening)
        + "\n\n" + pick(GENERAL.openings, days, si, MULT.openingGeneral);

      const closing = pick(sd.closings, days, si, MULT.closingSign)
        + "\n\n" + pick(GENERAL.closings, days, si, MULT.closingGeneral);

      const theme = pick(sd.theme, days, si, MULT.dailyTheme);

      result.signs[signKey].push({
        date:               dateStr,
        sign:               meta.name,
        element:            meta.element,
        modality:           meta.modality,
        ruler:              meta.ruler,
        opening,
        love:               pick(GENERAL.love,   days, si, MULT.love),
        work:               pick(GENERAL.work,   days, si, MULT.work),
        health:             pick(GENERAL.health, days, si, MULT.health),
        money:              pick(GENERAL.money,  days, si, MULT.money),
        closing,
        dailyTheme:         theme,
        dailyNumber:        number.value,
        dailyNumberMeaning: number.meaning,
        dailyColor:         color.name,
        dailyColorHex:      color.hex,
        dailyColorMeaning:  color.meaning,
        dailyStone:         stone.name,
        dailyStoneMeaning:  stone.meaning,
        compatibleSign:     compat ? compat.name : '',
      });
    }
  }

  generatedJSON = result;
  const total = Object.keys(SIGNS_META).length * daysInMonth;

  document.getElementById('status').textContent =
    `✓ Gerados ${total} registros (12 signos × ${daysInMonth} dias) para ${month}/${year}`;

  document.getElementById('monthInfo').style.display = 'block';
  document.getElementById('monthInfo').innerHTML =
    `<strong>Mês ${month}/${year}:</strong> ${daysInMonth} dias — 12 signos ocidentais em Português (Brasil)`;

  document.getElementById('downloadBtn').style.display = 'inline-block';
}

function downloadJSON() {
  if (!generatedJSON) return;
  const { month, year } = generatedJSON;
  const filename = `horoscopo_ocidental_ptbr_${year}_${String(month).padStart(2,'0')}.json`;
  const blob = new Blob([JSON.stringify(generatedJSON, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
