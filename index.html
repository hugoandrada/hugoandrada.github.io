// ── GENERATOR ────────────────────────────────────────────────────────────────
let generatedJSON = null;

function generate() {
  const month = parseInt(document.getElementById('month').value);
  const year  = parseInt(document.getElementById('year').value);

  const daysInMonth = new Date(year, month, 0).getDate();
  const result = { month, year, signs: {} };

  for (const sign of SIGNS) {
    result.signs[sign.key] = [];

    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(year, month - 1, day);
      const days = daysSinceBase(date);
      const si   = sign.index;
      const sd   = SIGN_DATA[sign.key];

      const signClosing    = pick(sd.closings,        days, si, MULT.closingSign);
      const generalClosing = pick(GENERAL.closings,   days, si, MULT.closingGeneral);
      const number         = pick(GENERAL.numbers,    days, si, MULT.dailyNumber);
      const color          = pick(GENERAL.colors,     days, si, MULT.dailyColor);
      const stone          = pick(GENERAL.stones,     days, si, MULT.dailyStone);

      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

      result.signs[sign.key].push({
        date: dateStr,
        opening:            pick(sd.openings,    days, si, MULT.opening),
        love:               pick(GENERAL.love,   days, si, MULT.love),
        work:               pick(GENERAL.work,   days, si, MULT.work),
        health:             pick(GENERAL.health, days, si, MULT.health),
        money:              pick(GENERAL.money,  days, si, MULT.money),
        closing: {
          en: signClosing.en + "\n\n" + generalClosing.en,
          es: signClosing.es + "\n\n" + generalClosing.es,
        },
        dailyTheme:         pick(sd.theme,       days, si, MULT.dailyTheme),
        dailyNumber:        number.value,
        dailyNumberMeaning: number.meaning,
        dailyColor:         color.name,
        dailyColorHex:      color.hex,
        dailyColorMeaning:  color.meaning,
        dailyStone:         stone.name,
        dailyStoneMeaning:  stone.meaning,
      });
    }
  }

  generatedJSON = result;
  const total = SIGNS.length * daysInMonth;
  document.getElementById('status').textContent =
    `✓ Generated ${total} entries (${SIGNS.length} signs × ${daysInMonth} days) for ${month}/${year}`;
  document.getElementById('downloadBtn').style.display = 'inline-block';
}

function downloadJSON() {
  if (!generatedJSON) return;
  const { month, year } = generatedJSON;
  const filename = `horoscope_${year}_${String(month).padStart(2,'0')}.json`;
  const blob = new Blob([JSON.stringify(generatedJSON, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
